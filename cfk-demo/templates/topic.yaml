apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: test
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=true
spec:
  name: test
  partitionCount: 1
  replicas: 1
  configs:
    cleanup.policy: delete
    min.insync.replicas: '1'
  kafkaClusterRef:
    name: {{ .Values.kafka.name }}
  kafkaRestClassRef:
    name: default
---
